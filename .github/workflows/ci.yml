name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate contracts and references
        run: python -m style_attractor_lab validate .
      - name: Enumerate the complete catalog
        run: python -m style_attractor_lab catalog --json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile starter recipe
        run: python -m style_attractor_lab assemble recipes/balanced_direct.yaml --output /tmp/balanced_direct.md
      - name: Compile cross-turn recipe
        run: python -m style_attractor_lab assemble recipes/relational_continuity.yaml --output /tmp/relational_continuity.md
